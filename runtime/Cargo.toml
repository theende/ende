[package]
name = "ende_runtime"
version = "0.267.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Provides the deno runtime library"

[features]
# "fake" feature that allows to generate docs on docs.rs
docsrs = []
# A feature that allows excluding `./js/99_main.js` from the exported extension.
exclude_runtime_main_js = []
# A dev feature to disable creation and loading of snapshots in favor of
# loading JS sources at runtime. Extensions' `lazy_loaded_*` files are read
# from disk via their `LoadedFromFsDuringSnapshot` paths.
hmr = ["transpile"]
snapshot = ["transpile"]
transpile = ["deno_ast"]

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(tokio_unstable)'] }

[lib]
name = "ende_runtime"
path = "lib.rs"

[dependencies]
async-trait.workspace = true
base64.workspace = true
boxed_error.workspace = true
color-print.workspace = true
deno_ast = { workspace = true, optional = true }
deno_error.workspace = true
deno_path_util.workspace = true
deno_terminal.workspace = true
ed25519-dalek.workspace = true
encoding_rs.workspace = true
ende_bundle_runtime.workspace = true
ende_cache.workspace = true
ende_canvas.workspace = true
ende_core.workspace = true
ende_cron.workspace = true
ende_crypto.workspace = true
ende_env.workspace = true
ende_features.workspace = true
ende_fetch.workspace = true
ende_ffi.workspace = true
ende_fs = { workspace = true, features = ["sync_fs"] }
ende_http.workspace = true
ende_image.workspace = true
ende_inspector_server.workspace = true
ende_io.workspace = true
ende_kv.workspace = true
ende_napi.workspace = true
ende_net.workspace = true
ende_node.workspace = true
ende_node_crypto.workspace = true
ende_node_sqlite.workspace = true
ende_os.workspace = true
ende_permissions.workspace = true
ende_process.workspace = true
ende_resolver = { workspace = true, features = ["sync"] }
ende_signals.workspace = true
ende_telemetry.workspace = true
ende_tls.workspace = true
ende_web.workspace = true
ende_webgpu.workspace = true
ende_webidl.workspace = true
ende_websocket.workspace = true
ende_webstorage.workspace = true
faster-hex.workspace = true
fastwebsockets.workspace = true
http.workspace = true
http-body-util.workspace = true
hyper.workspace = true
libc.workspace = true
log.workspace = true
node_resolver = { workspace = true, features = ["sync"] }
notify.workspace = true
once_cell.workspace = true
qbsdiff.workspace = true
raw-window-handle.workspace = true
regex.workspace = true
rustyline = { workspace = true, features = ["custom-bindings"] }
same-file.workspace = true
serde.workspace = true
serde_bytes.workspace = true
sha2.workspace = true
sys_traits.workspace = true
thiserror.workspace = true
tokio.workspace = true
tokio-metrics.workspace = true
twox-hash.workspace = true
uuid.workspace = true

[target.'cfg(target_os = "macos")'.dependencies]
unicode-normalization.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Console", "Win32_System_Diagnostics_ToolHelp", "Win32_UI_Input_KeyboardAndMouse"] }

[target.'cfg(unix)'.dependencies]
nix.workspace = true

[dev-dependencies]
# Used in benchmark
test_util.workspace = true

[package.metadata.docs.rs]
features = ["docsrs"]
