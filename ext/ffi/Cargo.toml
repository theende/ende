[package]
name = "ende_ffi"
version = "0.246.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
readme = "README.md"
repository.workspace = true
description = "Dynamic library ffi for deno"

[lib]
path = "lib.rs"

[dependencies]
cranelift.workspace = true
cranelift-native.workspace = true
deno_error.workspace = true
dlopen2.workspace = true
ende_core.workspace = true
ende_env.workspace = true
ende_permissions.workspace = true
endert_helper.workspace = true
libffi.workspace = true
log.workspace = true
memmap2.workspace = true
num-bigint.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_Foundation", "Win32_Globalization", "Win32_System_Diagnostics_Debug"] }

[dev-dependencies]
sys_traits = { workspace = true, features = ["libc", "real"] }

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(target_aarch, values("x86_64", "aarch64"))'] }
