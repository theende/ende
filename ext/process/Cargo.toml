[package]
name = "ende_process"
version = "0.74.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
readme = "README.md"
repository.workspace = true
description = "Subprocess APIs for Ende"

[lib]
path = "lib.rs"

[dependencies]
deno_error.workspace = true
deno_path_util.workspace = true
ende_core.workspace = true
ende_io.workspace = true
ende_os.workspace = true
ende_permissions.workspace = true
ende_signals.workspace = true
ende_subprocess_windows.workspace = true
libc.workspace = true
log.workspace = true
rand.workspace = true
serde.workspace = true
sys_traits = { workspace = true, features = ["real", "winapi", "libc"] }
thiserror.workspace = true
tokio.workspace = true

[target.'cfg(unix)'.dependencies]
nix = { workspace = true, features = ["signal", "process"] }

[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = ["Win32_System_Threading"] }
