# Pinned Ende release for CI's tooling jobs.
#
# tools/release/fetch_ende.sh downloads
#   https://dl.ende.sh/release/v<version>/ende-<target>.zip
# for the version below, and the zip must match both its published
# `.zip.sha256sum` and the SHA-256 pinned here for the target. Nothing falls
# back to the latest release: bump this file on purpose after a release.
#
# After each release, post_publish opens a PR bumping this
# (tools/release/bump_ende_lock.ts). To bump by hand: change the version, take
# each target's hash from the release's `ende-<target>.zip.sha256sum` on
# GitHub, check it against the zip on dl.ende.sh
# (`shasum -a 256 ende-<target>.zip`), and fill it in below.
#
# Format: one `<target>  <zip sha256>` per line. The
# `# version: YYYY.MM.DD[.N]` directive is the Ende version, without the `v`.
#
# version: 2026.11.10

