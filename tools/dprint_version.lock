# Pinned dprint CLI for tools/format.js.
#
# tools/release/fetch_dprint.sh downloads
#   https://dl.ende.sh/dprint/<version>/dprint-<target>.zip
# for the version below. The zip must match both its published
# `.zip.sha256sum` and the SHA-256 pinned here for the target, and the `dprint`
# binary in it (`dprint.exe` on Windows) the binary SHA-256 pinned here. The
# zips on dl.ende.sh are dprint's own GitHub release zips, unchanged
# (https://github.com/dprint/dprint/releases/download/<version>/SHASUMS256.txt
# lists the same hashes). The formatter plugins are pinned separately, with
# `url@sha256` in .dprint.json.
#
# To bump: check each zip against the release's SHASUMS256.txt, upload them to
# dl.ende.sh/dprint/<version>/ with their `.zip.sha256sum` files, then change
# the version and fill in each target's zip and binary SHA-256 below.
#
# Format: one `<target>  <zip sha256>  <binary sha256>` per line. The
# `# version: X.Y.Z` directive is the dprint version.
#
