            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: '127-cargo-home-linux-x86_64-build-main-${{ github.sha }}-${{ github.run_id }}'
      - name: Cache build output
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: 'github.ref == ''refs/heads/primary'' && !startsWith(github.ref, ''refs/tags/'')'
        with:
          path: |-
