          fetch-depth: 5
          submodules: false
      - name: Install Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        if: github.event_name == 'pull_request'
        with:
          deno-version: v2.x
