            -C link-arg=/tmp/glibc_math_shim.o
            -C link-arg=-Wl,--wrap=expf
            -C link-arg=-Wl,--wrap=powf
            -C link-arg=-Wl,--wrap=exp2f
            -C link-arg=-Wl,--wrap=log2f
            -C link-arg=-Wl,--wrap=logf
            --cfg tokio_unstable
            $RUSTFLAGS
          __1
          CC=/usr/bin/clang-22
          CFLAGS=$CFLAGS
          " > $GITHUB_ENV
      - name: Download artifact debug-linux-x86_64-ende
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        if: '!startsWith(github.ref, ''refs/tags/'')'
        with:
          name: debug-linux-x86_64-ende
          path: target/debug
      - name: Set target/debug/ende permissions
        if: '!startsWith(github.ref, ''refs/tags/'')'
        run: chmod +x target/debug/ende
      - name: Download artifact debug-linux-x86_64-endert
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        if: '!startsWith(github.ref, ''refs/tags/'') && (matrix.test_crate == ''integration'' || matrix.test_crate == ''specs'')'
        with:
          name: debug-linux-x86_64-endert
          path: target/debug
      - name: Set target/debug/endert permissions
        if: '!startsWith(github.ref, ''refs/tags/'') && (matrix.test_crate == ''integration'' || matrix.test_crate == ''specs'')'
        run: chmod +x target/debug/endert
      - name: Download artifact debug-linux-x86_64-test-server
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        if: '!startsWith(github.ref, ''refs/tags/'') && (matrix.test_crate == ''integration'' || matrix.test_crate == ''specs'' || matrix.test_crate == ''unit'')'
        with:
          name: debug-linux-x86_64-test-server
          path: target/debug
      - name: Set target/debug/test_server permissions
        if: '!startsWith(github.ref, ''refs/tags/'') && (matrix.test_crate == ''integration'' || matrix.test_crate == ''specs'' || matrix.test_crate == ''unit'')'
        run: chmod +x target/debug/test_server
      - name: Set up playwright cache
        uses: actions/cache@668228422ae6a00e4ad889ee87cd7109ec5666a7
        if: '!startsWith(github.ref, ''refs/tags/'')'
        with:
          path: ./.ms-playwright
          key: 'playwright-${{ runner.os }}-${{ runner.arch }}'
      - name: Build ffi (debug)
        if: '!startsWith(github.ref, ''refs/tags/'') && matrix.test_crate == ''specs'''
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo build -p test_ffi
      - name: Test (debug)
        if: '!startsWith(github.ref, ''refs/tags/'')'
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
          CI_SHARD_INDEX: '${{ matrix.shard_index }}'
          CI_SHARD_TOTAL: '${{ matrix.shard_total }}'
        run: |-
          report="target/test_results_${{ matrix.test_crate }}.json"
          rm -f "$report"
          status=0
          cargo test -p ${{ matrix.test_package }} --test ${{ matrix.test_crate }} || status=$?
          if [ "$status" -eq 0 ]; then exit 0; fi
          if [ ! -f "$report" ]; then
            echo "::error::tests exited with $status and wrote no $report"
            exit "$status"
          fi
          known='{"unit::lint_plugin_test":"upstream @std/testing reads Deno.version.deno, which Ende removed; fixed once std is published under @ende","integration::coverage::no_snaps":"upstream @std/testing reads Deno.version.deno, which Ende removed; fixed once std is published under @ende","specs::upgrade::stable":"needs real releases at dl.ende.sh","specs::upgrade::out":"needs real releases at dl.ende.sh","specs::upgrade::space_in_tmp":"needs real releases at dl.ende.sh","specs::upgrade::specific_stable":"needs real releases at dl.ende.sh"}'
          failed=$(jq -r '.tests[] | select(.failed) | .name' "$report")
          unexpected=$(jq -r --argjson known "$known" '.tests[] | select(.failed) | .name | select($known[.] == null)' "$report")
          if [ -z "$failed" ] || [ -n "$unexpected" ]; then
            echo "::error::tests exited with $status; failures not in knownCiFailures (.github/workflows/ci.ts):"
            echo "${unexpected:-<none listed in $report>}"
            exit "$status"
          fi
          jq -r --argjson known "$known" '.tests[] | select(.failed) | "::warning::tolerated known failure \(.name): \($known[.name])"' "$report"
      - name: Ensure no git changes
        if: '!startsWith(github.ref, ''refs/tags/'') && github.event_name == ''pull_request'''
        run: |-
          if [[ -n "$(git status --porcelain)" ]]; then
          echo "❌ Git working directory is dirty. Ensure `cargo test` is not modifying git tracked files."
          echo ""
          echo "📋 Status:"
          git status
          echo ""
          exit 1
          fi
      - name: Upload test results
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        if: '!startsWith(github.ref, ''refs/tags/'') && always()'
        with:
          name: 'test-results-linux-x86_64-debug-${{ matrix.test_crate }}${{ matrix.shard_total > 1 && format(''-shard-{0}'', matrix.shard_index) || '''' }}.json'
          path: 'target/test_results_${{ matrix.test_crate }}.json'
  build-libs-debug-linux-x86_64:
    name: build libs debug linux-x86_64
    needs:
      - pre_build
    if: needs.pre_build.outputs.skip_build != 'true' && needs.pre_build.outputs.docs_only != 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Configure git
        if: '!startsWith(github.ref, ''refs/tags/'')'
        run: |-
          git config --global core.symlinks true
          git config --global fetch.parallel 32
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        if: '!startsWith(github.ref, ''refs/tags/'')'
        with:
          fetch-depth: 5
          submodules: false
      - name: Pre-install rustup 1.28.2 (workaround broken 1.29.0)
        if: '!startsWith(github.ref, ''refs/tags/'')'
        shell: bash
        run: |-
          if command -v rustup >/dev/null 2>&1; then
            if ! rustup --version 2>&1 | grep -q '1\.29\.0'; then exit 0; fi
            echo "Detected broken rustup 1.29.0, replacing with 1.28.2"
          fi
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)     target=x86_64-unknown-linux-gnu; ext= ;;
            Linux-ARM64)   target=aarch64-unknown-linux-gnu; ext= ;;
            macOS-X64)     target=x86_64-apple-darwin; ext= ;;
            macOS-ARM64)   target=aarch64-apple-darwin; ext= ;;
            Windows-X64)   target=x86_64-pc-windows-msvc; ext=.exe ;;
            Windows-ARM64) target=aarch64-pc-windows-msvc; ext=.exe ;;
            *) echo "Unsupported: ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL \
            "https://static.rust-lang.org/rustup/archive/1.28.2/${target}/rustup-init${ext}" \
            -o "rustup-init${ext}"
          chmod +x "rustup-init${ext}"
          "./rustup-init${ext}" -y --default-toolchain none --no-modify-path
          rm "rustup-init${ext}"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621
        if: '!startsWith(github.ref, ''refs/tags/'')'
      - name: Restore cache cargo home
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: '!startsWith(github.ref, ''refs/tags/'')'
        with:
          path: |-
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: never_saved
          restore-keys: 127-cargo-home-linux-x86_64-build-main-
      - name: Restore cache build output
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: '!startsWith(github.ref, ''refs/tags/'')'
        with:
          path: |-
            ./target
            !./target/*/gn_out
            !./target/*/gn_root
            !./target/*/*.zip
            !./target/*/*.tar.gz
          key: never_saved
          restore-keys: 127-cargo-target-linux-x86_64-debug-lint-
      - name: Apply and update mtime cache
        uses: ./.github/mtime_cache
        if: '!startsWith(github.ref, ''refs/tags/'')'
        with:
          cache-path: ./target
      - name: Install wasm target
        if: '!startsWith(github.ref, ''refs/tags/'')'
        run: rustup target add wasm32-unknown-unknown
      - name: Cargo check (ende_resolver)
        if: '!startsWith(github.ref, ''refs/tags/'')'
        run: cargo check --target wasm32-unknown-unknown -p ende_resolver && cargo check --target wasm32-unknown-unknown -p ende_resolver --features graph && cargo check --target wasm32-unknown-unknown -p ende_resolver --features graph --features deno_ast
      - name: Cargo check (ende_config)
        if: '!startsWith(github.ref, ''refs/tags/'')'
        run: |-
          cargo check --no-default-features -p ende_config
          cargo check --no-default-features --features workspace -p ende_config
          cargo check --no-default-features --features workspace --features sync -p ende_config
          cargo check --target wasm32-unknown-unknown --all-features -p ende_config
          cargo check -p ende --features=lsp-tracing
      - name: Check QuickJS backend (ende + endert)
        if: '!startsWith(github.ref, ''refs/tags/'')'
        env:
          CARGO_PROFILE_DEV_DEBUG: 0
        run: cargo check --locked -p ende -p endert --no-default-features --features quickjs
  lint:
    name: 'lint ${{ matrix.profile }} ${{ matrix.os }}-${{ matrix.arch }}'
    needs:
      - pre_build
    if: needs.pre_build.outputs.skip_build != 'true'
    runs-on: '${{ matrix.runner }}'
    timeout-minutes: 30
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - os: linux
            arch: x86_64
            runner: ubuntu-24.04
            profile: debug
            job: lint
    steps:
      - name: Configure git
        run: |-
          git config --global core.symlinks true
          git config --global fetch.parallel 32
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          fetch-depth: 5
          submodules: false
      - name: Clone submodule ./tests/util/std
        run: git submodule update --init --recursive --depth=1 -- ./tests/util/std
      - name: Restore cache cargo home
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: '!startsWith(github.ref, ''refs/tags/'')'
        with:
          path: |-
            ~/.cargo/.crates.toml
            ~/.cargo/.crates2.json
            ~/.cargo/bin
            ~/.cargo/registry/index
            ~/.cargo/registry/cache
            ~/.cargo/git/db
          key: never_saved
          restore-keys: '127-cargo-home-${{ matrix.os }}-${{ matrix.arch }}-build-main-'
      - name: Restore cache build output
        uses: actions/cache/restore@0057852bfaa89a56745cba8c7296529d2fc39830
        if: '!startsWith(github.ref, ''refs/tags/'') && github.event_name != ''schedule'''
        with:
          path: |-
            ./target
            !./target/*/gn_out
            !./target/*/gn_root
            !./target/*/*.zip
            !./target/*/*.tar.gz
          key: never_saved
          restore-keys: '127-cargo-target-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.profile }}-lint-'
      - name: Apply and update mtime cache
        uses: ./.github/mtime_cache
        with:
          cache-path: ./target
      - name: Pre-install rustup 1.28.2 (workaround broken 1.29.0)
        shell: bash
        run: |-
          if command -v rustup >/dev/null 2>&1; then
            if ! rustup --version 2>&1 | grep -q '1\.29\.0'; then exit 0; fi
            echo "Detected broken rustup 1.29.0, replacing with 1.28.2"
          fi
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)     target=x86_64-unknown-linux-gnu; ext= ;;
            Linux-ARM64)   target=aarch64-unknown-linux-gnu; ext= ;;
            macOS-X64)     target=x86_64-apple-darwin; ext= ;;
            macOS-ARM64)   target=aarch64-apple-darwin; ext= ;;
            Windows-X64)   target=x86_64-pc-windows-msvc; ext=.exe ;;
            Windows-ARM64) target=aarch64-pc-windows-msvc; ext=.exe ;;
            *) echo "Unsupported: ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL \
            "https://static.rust-lang.org/rustup/archive/1.28.2/${target}/rustup-init${ext}" \
            -o "rustup-init${ext}"
          chmod +x "rustup-init${ext}"
          "./rustup-init${ext}" -y --default-toolchain none --no-modify-path
          rm "rustup-init${ext}"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621
      - name: Install Deno
        uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x
      - name: test_format.js
        if: matrix.os == 'linux'
        run: deno run --allow-write --allow-read --allow-run --allow-net ./tools/format.js --check
      - name: jsdoc_checker.js
        if: matrix.os == 'linux'
        run: deno run --allow-read --allow-env --allow-sys ./tools/jsdoc_checker.js
      - name: lint.js
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: deno run --allow-write --allow-read --allow-run --allow-net --allow-env ./tools/lint.js
      - name: Cache build output
        uses: actions/cache/save@0057852bfaa89a56745cba8c7296529d2fc39830
        if: 'github.ref == ''refs/heads/primary'' && !startsWith(github.ref, ''refs/tags/'') && matrix.os == ''linux'''
        with:
          path: |-
            ./target
            !./target/*/gn_out
            !./target/*/gn_root
            !./target/*/*.zip
            !./target/*/*.tar.gz
          key: '127-cargo-target-${{ matrix.os }}-${{ matrix.arch }}-${{ matrix.profile }}-lint-${{ github.sha }}-${{ github.run_id }}'
  ci-status:
    name: ci status
    needs:
      - build-debug-macos-aarch64
      - test-debug-macos-aarch64
      - test-libs-debug-macos-aarch64
      - build-debug-linux-x86_64
      - test-debug-linux-x86_64
      - build-libs-debug-linux-x86_64
      - lint
      - pre_build
    if: needs.pre_build.outputs.skip_build != 'true' && always()
    runs-on: ubuntu-latest
    steps:
      - name: Ensure CI success
        run: |-
          if [[ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" == "true" ]]; then
            echo 'CI failed'
            exit 1
          fi

