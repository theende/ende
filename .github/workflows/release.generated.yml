# GENERATED BY ./release.ts -- DO NOT DIRECTLY EDIT

name: release
on:
  push:
    tags:
      - v*
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to build, e.g. v2026.10.14'
        type: string
        required: true
permissions:
  contents: read
concurrency:
  group: 'release-${{ inputs.tag || github.ref_name }}'
  cancel-in-progress: false
env:
  RELEASE_TAG: '${{ inputs.tag || github.ref_name }}'
jobs:
  verify:
    name: verify tag
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      version: '${{ steps.version.outputs.version }}'
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '${{ inputs.tag && format(''refs/tags/{0}'', inputs.tag) || github.ref }}'
          fetch-depth: 1
          submodules: false
      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Check the tag matches cli/lib/version.txt
        id: version
        run: |-
          ./tools/release/verify_release_tag.ts "$RELEASE_TAG"
          echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
  build:
    name: 'build ${{ matrix.target }}'
    needs:
      - verify
    runs-on: '${{ matrix.runner }}'
    timeout-minutes: 240
    defaults:
      run:
        shell: bash
    strategy:
      matrix:
        include:
          - target: aarch64-apple-darwin
            runner: macos-14
            os: macos
            arch: aarch64
          - target: x86_64-unknown-linux-gnu
            runner: ubuntu-24.04
            os: linux
            arch: x86_64
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
            os: linux
            arch: aarch64
          - target: x86_64-pc-windows-msvc
            runner: windows-2022
            os: windows
            arch: x86_64
      fail-fast: false
    env:
      CARGO_TERM_COLOR: always
      RUST_BACKTRACE: full
      TARGET: '${{ matrix.target }}'
      ENDE_VERSION: '${{ needs.verify.outputs.version }}'
      HAS_APPLE_CERTIFICATE: '${{ secrets.APPLE_CERTIFICATE_P12 != '''' }}'
      HAS_APPLE_NOTARY_KEY: '${{ secrets.APPLE_NOTARY_KEY != '''' }}'
      HAS_WINDOWS_CERTIFICATE: '${{ secrets.WINDOWS_CERTIFICATE_PFX != '''' }}'
    steps:
      - name: Configure git
        run: |-
          git config --global core.symlinks true
          git config --global fetch.parallel 32
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: '${{ inputs.tag && format(''refs/tags/{0}'', inputs.tag) || github.ref }}'
          fetch-depth: 1
          submodules: false
      - name: Remove macOS cURL --ipv4 flag
        if: matrix.os == 'macos'
        run: rm ~/.curlrc || true
      - name: Clone submodule ./tests/util/std
        run: git submodule update --init --recursive --depth=1 -- ./tests/util/std
      - if: matrix.os == 'macos'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: echo $GITHUB_WORKSPACE/third_party/prebuilt/mac >> $GITHUB_PATH
      - name: Install Deno
        uses: denoland/setup-deno@22d081ff2d3a40755e97629de92e3bcbfa7cf2ed
        with:
          deno-version: v2.x
      - name: Install macOS aarch64 lld
        if: matrix.os == 'macos' && matrix.arch == 'aarch64'
        env:
          GITHUB_TOKEN: '${{ secrets.GITHUB_TOKEN }}'
        run: ./tools/install_prebuilt.js ld64.lld
      - name: Install Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: 3.11
      - name: Remove unused versions of Python
        if: matrix.os == 'windows'
        shell: pwsh
        run: |-
          $env:PATH -split ";" |
            Where-Object { Test-Path "$_\python.exe" } |
            Select-Object -Skip 1 |
            ForEach-Object { Move-Item "$_" "$_.disabled" }
      - name: Pre-install rustup 1.28.2 (workaround broken 1.29.0)
        shell: bash
        run: |-
          if command -v rustup >/dev/null 2>&1; then
            if ! rustup --version 2>&1 | grep -q '1\.29\.0'; then exit 0; fi
            echo "Detected broken rustup 1.29.0, replacing with 1.28.2"
          fi
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)     target=x86_64-unknown-linux-gnu; ext= ;;
            Linux-ARM64)   target=aarch64-unknown-linux-gnu; ext= ;;
            macOS-X64)     target=x86_64-apple-darwin; ext= ;;
            macOS-ARM64)   target=aarch64-apple-darwin; ext= ;;
            Windows-X64)   target=x86_64-pc-windows-msvc; ext=.exe ;;
            Windows-ARM64) target=aarch64-pc-windows-msvc; ext=.exe ;;
            *) echo "Unsupported: ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          curl --proto '=https' --tlsv1.2 --retry 10 --retry-connrefused -fsSL \
            "https://static.rust-lang.org/rustup/archive/1.28.2/${target}/rustup-init${ext}" \
            -o "rustup-init${ext}"
          chmod +x "rustup-init${ext}"
          "./rustup-init${ext}" -y --default-toolchain none --no-modify-path
          rm "rustup-init${ext}"
          echo "${CARGO_HOME:-$HOME/.cargo}/bin" >> "$GITHUB_PATH"
      - uses: dsherret/rust-toolchain-file@3551321aa44dd44a0393eb3b6bdfbc5d25ecf621
      - name: Set up incremental LTO and sysroot build
        if: matrix.os == 'linux'
        timeout-minutes: 10
        run: |-
          # Setting up sysroot
          export DEBIAN_FRONTEND=noninteractive
          # Avoid running man-db triggers, which sometimes takes several minutes
          # to complete.
          sudo apt-get -qq remove --purge -y man-db > /dev/null 2> /dev/null
          # Remove older clang before we install
          sudo apt-get -qq remove   'clang-12*' 'clang-13*' 'clang-14*' 'clang-15*' 'clang-16*' 'clang-17*' 'clang-18*' 'clang-19*' 'clang-20*' 'clang-21*' 'llvm-12*' 'llvm-13*' 'llvm-14*' 'llvm-15*' 'llvm-16*' 'llvm-17*' 'llvm-18*' 'llvm-19*' 'llvm-20*' 'llvm-21*' 'lld-12*' 'lld-13*' 'lld-14*' 'lld-15*' 'lld-16*' 'lld-17*' 'lld-18*' 'lld-19*' 'lld-20*' 'lld-21*' > /dev/null 2> /dev/null

          # Install clang-XXX, lld-XXX, and debootstrap.
          echo "deb http://apt.llvm.org/noble/ llvm-toolchain-noble-22 main" |
            sudo dd of=/etc/apt/sources.list.d/llvm-toolchain-noble-22.list
          curl https://apt.llvm.org/llvm-snapshot.gpg.key |
            gpg --dearmor                                 |
          sudo dd of=/etc/apt/trusted.gpg.d/llvm-snapshot.gpg
          sudo apt-get update
          # this was unreliable sometimes, so try again if it fails
          sudo apt-get install -y --no-install-recommends clang-22 lld-22 clang-tools-22 clang-format-22 clang-tidy-22 || (echo 'Failed. Trying again.' && sudo apt-get clean && sudo apt-get update && sudo apt-get install -y --no-install-recommends clang-22 lld-22 clang-tools-22 clang-format-22 clang-tidy-22)
          # Fix alternatives
          (yes '' | sudo update-alternatives --force --all) > /dev/null 2> /dev/null || true

          clang-22 -c -o /tmp/memfd_create_shim.o tools/memfd_create_shim.c -fPIC
          clang-22 -c -o /tmp/glibc_math_shim.o tools/glibc_math_shim.c -fPIC

          echo "Decompressing sysroot..."
          wget -q https://github.com/denoland/deno_sysroot_build/releases/download/sysroot-20250207/sysroot-`uname -m`.tar.xz -O /tmp/sysroot.tar.xz
          cd /
          xzcat /tmp/sysroot.tar.xz | sudo tar -x
          sudo mount --rbind /dev /sysroot/dev
          sudo mount --rbind /sys /sysroot/sys
          sudo mount --rbind /home /sysroot/home
          sudo mount -t proc /proc /sysroot/proc
          cd

          echo "Done."

          # Configure the build environment. Both Rust and Clang will produce
          # llvm bitcode only, so we can use lld's incremental LTO support.

          # Load the sysroot's env vars
          echo "sysroot env:"
          cat /sysroot/.env
          . /sysroot/.env

          # Important notes:
          #   1. -ldl seems to be required to avoid a failure in FFI tests. This flag seems
          #      to be in the Rust default flags in the smoketest, so uncertain why we need
          #      to be explicit here.
          #   2. RUSTFLAGS and RUSTDOCFLAGS must be specified, otherwise the doctests fail
          #      to build because the object formats are not compatible.
          echo "
          CARGO_PROFILE_BENCH_INCREMENTAL=false
          CARGO_PROFILE_RELEASE_INCREMENTAL=false
          RUSTFLAGS<<__1
            -C linker-plugin-lto=true
            -C linker=clang-22
            -C link-arg=-fuse-ld=lld-22
            -C link-arg=-Wl,--icf=safe
            -C link-arg=-ldl
            -C link-arg=-Wl,--allow-shlib-undefined
            -C link-arg=-Wl,--thinlto-cache-dir=$(pwd)/target/release/lto-cache
            -C link-arg=-Wl,--thinlto-cache-policy,cache_size_bytes=700m
            -C link-arg=/tmp/memfd_create_shim.o
            -C link-arg=/tmp/glibc_math_shim.o
            -C link-arg=-Wl,--wrap=expf
            -C link-arg=-Wl,--wrap=powf
            -C link-arg=-Wl,--wrap=exp2f
            -C link-arg=-Wl,--wrap=log2f
            -C link-arg=-Wl,--wrap=logf
            --cfg tokio_unstable
            $RUSTFLAGS
          __1
          RUSTDOCFLAGS<<__1
            -C linker-plugin-lto=true
            -C linker=clang-22
            -C link-arg=-fuse-ld=lld-22
            -C link-arg=-Wl,--icf=safe
            -C link-arg=-ldl
            -C link-arg=-Wl,--allow-shlib-undefined
            -C link-arg=-Wl,--thinlto-cache-dir=$(pwd)/target/release/lto-cache
            -C link-arg=-Wl,--thinlto-cache-policy,cache_size_bytes=700m
            -C link-arg=/tmp/memfd_create_shim.o
            -C link-arg=/tmp/glibc_math_shim.o
            -C link-arg=-Wl,--wrap=expf
            -C link-arg=-Wl,--wrap=powf
            -C link-arg=-Wl,--wrap=exp2f
            -C link-arg=-Wl,--wrap=log2f
            -C link-arg=-Wl,--wrap=logf
            --cfg tokio_unstable
            $RUSTFLAGS
          __1
          CC=/usr/bin/clang-22
          CFLAGS=$CFLAGS
          " > $GITHUB_ENV
      - name: Build release
        env:
          ENDE_SNAPSHOT_MINIFY_SOURCES: '1'
        run: |-
          df -h
          cargo build --release --locked -p ende -p endert --bin ende --bin endert --features=ende/panic-trace
          cargo build --release --locked -p endert_desktop
          df -h
      - name: Strip binaries (linux)
        if: matrix.os == 'linux'
        run: |-
          cd target/release
          strip --strip-debug ende endert libendert.so
      - name: Strip binaries (mac)
        if: matrix.os == 'macos'
        run: |-
          cd target/release
          strip -x -S ende endert libendert.dylib
      - name: Check ende binary runs on an old glibc (linux)
        if: matrix.os == 'linux'
        run: sudo chroot /sysroot "$(pwd)/target/release/ende" --version
      - name: Sign ende (mac)
        if: matrix.os == 'macos' && env.HAS_APPLE_CERTIFICATE == 'true'
        env:
          APPLE_CERTIFICATE_P12: '${{ secrets.APPLE_CERTIFICATE_P12 }}'
          APPLE_CERTIFICATE_PASSWORD: '${{ secrets.APPLE_CERTIFICATE_PASSWORD }}'
        run: |-
          KEYCHAIN="$RUNNER_TEMP/release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -base64 24)"
          echo "$APPLE_CERTIFICATE_P12" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$RUNNER_TEMP/cert.p12" -k "$KEYCHAIN" -f pkcs12 -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign
          rm "$RUNNER_TEMP/cert.p12"
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security list-keychains -d user -s "$KEYCHAIN" "$HOME/Library/Keychains/login.keychain-db"
          IDENTITY="$(security find-identity -v -p codesigning "$KEYCHAIN" | grep -m 1 "Developer ID Application" | awk '{print $2}')"
          if [ -z "$IDENTITY" ]; then echo "::error::No Developer ID Application identity in APPLE_CERTIFICATE_P12"; exit 1; fi
          codesign --force --options runtime --timestamp --entitlements cli/entitlements.plist --keychain "$KEYCHAIN" --sign "$IDENTITY" target/release/ende
          codesign --verify --strict --verbose=2 target/release/ende
      - name: Sign ende.exe (windows)
        if: matrix.os == 'windows' && env.HAS_WINDOWS_CERTIFICATE == 'true'
        shell: pwsh
        env:
          WINDOWS_CERTIFICATE_PFX: '${{ secrets.WINDOWS_CERTIFICATE_PFX }}'
          WINDOWS_CERTIFICATE_PASSWORD: '${{ secrets.WINDOWS_CERTIFICATE_PASSWORD }}'
        run: |-
          $Pfx = Join-Path $env:RUNNER_TEMP "cert.pfx"
          [IO.File]::WriteAllBytes($Pfx, [Convert]::FromBase64String($env:WINDOWS_CERTIFICATE_PFX))
          $SignTool = (Get-ChildItem -Path "C:\Program Files*\Windows Kits\*\bin\*\x64\signtool.exe" -Recurse -ErrorAction SilentlyContinue | Select-Object -First 1).FullName
          & $SignTool sign /f $Pfx /p $env:WINDOWS_CERTIFICATE_PASSWORD /fd SHA256 /tr http://timestamp.digicert.com /td SHA256 target\release\ende.exe
          $SignExit = $LASTEXITCODE; Remove-Item $Pfx; if ($SignExit -ne 0) { throw "signtool sign failed" }
          & $SignTool verify /pa /v target\release\ende.exe
          if ($LASTEXITCODE -ne 0) { throw "signtool verify failed" }
      - name: Smoke test
        env:
          NO_COLOR: 1
        run: |-
          out="$(target/release/ende --version | tr -d "\r")"
          echo "$out"
          expected="ende $ENDE_VERSION (release, $TARGET)"
          read -r first_line <<< "$out"
          if [ "$first_line" != "$expected" ]; then echo "::error::ende --version does not start with: $expected"; exit 1; fi
          actual="$(target/release/ende eval "console.log(Ende.version.ende)" | tr -d "\r")"
          if [ "$actual" != "$ENDE_VERSION" ]; then echo "::error::Ende.version.ende is $actual, expected $ENDE_VERSION"; exit 1; fi
      - name: Generate delta patch
        env:
          GH_TOKEN: '${{ github.token }}'
          GH_REPO: '${{ github.repository }}'
        run: |-
          PREV_TAG="$(gh release view --json tagName --jq .tagName 2> /dev/null || true)"
          if [ -z "$PREV_TAG" ] || [ "$PREV_TAG" = "$RELEASE_TAG" ]; then
            echo "No previous published release, skipping delta"
            exit 0
          fi
          if ! gh release download "$PREV_TAG" --pattern "ende-$TARGET.zip" --dir prev-release; then
            echo "$PREV_TAG has no ende-$TARGET.zip, skipping delta"
            exit 0
          fi
          cd prev-release
          if command -v unzip > /dev/null; then unzip -o "ende-$TARGET.zip"; else 7z x -y "ende-$TARGET.zip"; fi
          cd ..
          cargo build --release --locked -p bsdiff_helper
          EXE=""; if [ "$RUNNER_OS" = Windows ]; then EXE=.exe; fi
          mkdir -p dist
          "target/release/bsdiff_helper$EXE" "prev-release/ende$EXE" "target/release/ende$EXE" "dist/ende-$TARGET.from-${PREV_TAG#v}.bsdiff"
      - name: Package
        run: ./tools/release/package_release.sh "$TARGET" target/release dist
      - name: Notarize ende (mac)
        if: matrix.os == 'macos' && env.HAS_APPLE_CERTIFICATE == 'true' && env.HAS_APPLE_NOTARY_KEY == 'true'
        env:
          APPLE_NOTARY_KEY: '${{ secrets.APPLE_NOTARY_KEY }}'
          APPLE_NOTARY_KEY_ID: '${{ secrets.APPLE_NOTARY_KEY_ID }}'
          APPLE_NOTARY_ISSUER_ID: '${{ secrets.APPLE_NOTARY_ISSUER_ID }}'
        run: |-
          KEY="$RUNNER_TEMP/notary_key.p8"
          printf "%s" "$APPLE_NOTARY_KEY" > "$KEY"
          AUTH=(--key "$KEY" --key-id "$APPLE_NOTARY_KEY_ID" --issuer "$APPLE_NOTARY_ISSUER_ID")
          xcrun notarytool submit "dist/ende-$TARGET.zip" "${AUTH[@]}" --wait --timeout 30m --output-format json > notary.json || true
          cat notary.json
          if [ "$(jq -r .status notary.json)" != Accepted ]; then
            ID="$(jq -r ".id // empty" notary.json)"
            if [ -n "$ID" ]; then xcrun notarytool log "$ID" "${AUTH[@]}"; fi
            rm "$KEY"
            echo "::error::Notarization failed"
            exit 1
          fi
          rm "$KEY"
      - name: Upload release assets
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f
        with:
          name: 'release-${{ matrix.target }}'
          path: dist/*
          if-no-files-found: error
          retention-days: 7
  release:
    name: draft GitHub release
    needs:
      - build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    timeout-minutes: 30
    steps:
      - name: Download release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Create draft release
        env:
          GH_TOKEN: '${{ github.token }}'
          GH_REPO: '${{ github.repository }}'
        run: |-
          ls -l dist
          cd dist
          IS_DRAFT="$(gh release view "$RELEASE_TAG" --json isDraft --jq .isDraft 2> /dev/null || true)"
          if [ -z "$IS_DRAFT" ]; then
            gh release create "$RELEASE_TAG" --draft --verify-tag --title "$RELEASE_TAG" --generate-notes ./*
          elif [ "$IS_DRAFT" = true ]; then
            echo "Draft for $RELEASE_TAG exists, replacing its assets"
            gh release upload "$RELEASE_TAG" --clobber ./*
          else
            echo "::error::$RELEASE_TAG is already published; refusing to replace its assets"
            exit 1
          fi
  dl_ende_sh:
    name: upload runtimes to dl.ende.sh
    needs:
      - build
    if: vars.DL_ENDE_SH_ENABLED == 'true'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - name: Download release assets
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53
        with:
          pattern: release-*
          path: dist
          merge-multiple: true
      - name: Upload endert and libendert archives
        env:
          AWS_ACCESS_KEY_ID: '${{ secrets.DL_S3_ACCESS_KEY_ID }}'
          AWS_SECRET_ACCESS_KEY: '${{ secrets.DL_S3_SECRET_ACCESS_KEY }}'
          AWS_ENDPOINT_URL_S3: '${{ secrets.DL_S3_ENDPOINT }}'
          AWS_DEFAULT_REGION: '${{ vars.DL_S3_REGION || ''auto'' }}'
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          DL_S3_BUCKET: '${{ secrets.DL_S3_BUCKET }}'
        run: 'aws s3 cp dist/ "s3://$DL_S3_BUCKET/release/$RELEASE_TAG/" --recursive --exclude "*" --include "endert-*" --include "libendert-*"'

