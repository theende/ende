# GENERATED BY ./post_publish.ts -- DO NOT DIRECTLY EDIT

name: post_publish
on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      version:
        description: 'Release tag to publish, e.g. v2026.10.14'
        type: string
        required: true
jobs:
  update-dl-version:
    name: update dl.ende.sh version
    if: vars.DL_ENDE_SH_ENABLED == 'true'
    runs-on: ubuntu-latest
    env:
      HAS_CLOUDFLARE_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN != '''' }}'
    steps:
      - name: Clone repository
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
      - uses: denoland/setup-deno@667a34cdef165d8d2b2e98dde39547c9daac7282
        with:
          deno-version: v2.x
      - name: Upload version file to dl.ende.sh
        env:
          AWS_ACCESS_KEY_ID: '${{ secrets.DL_S3_ACCESS_KEY_ID }}'
          AWS_SECRET_ACCESS_KEY: '${{ secrets.DL_S3_SECRET_ACCESS_KEY }}'
          AWS_ENDPOINT_URL_S3: '${{ secrets.DL_S3_ENDPOINT }}'
          AWS_DEFAULT_REGION: '${{ vars.DL_S3_REGION || ''auto'' }}'
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          AWS_RESPONSE_CHECKSUM_VALIDATION: when_required
          DL_S3_BUCKET: '${{ secrets.DL_S3_BUCKET }}'
          INPUT_VERSION: '${{ inputs.version }}'
        run: |-
          # On a manual run GITHUB_REF is whatever branch the job was
          # dispatched from, so the version has to come from the input.
          VERSION="${INPUT_VERSION:-${GITHUB_REF#refs/*/}}"
          # Never let a branch name reach the version files.
          case "$VERSION" in
            v[0-9]*) ;;
            *) echo "Not a release tag: $VERSION" >&2; exit 1 ;;
          esac
          deno run --allow-net --allow-write tools/release/update_versions_json.ts "$VERSION"
          aws s3 cp versions.json "s3://$DL_S3_BUCKET/versions.json" --content-type application/json
          LATEST_FILE=$(deno run --allow-net --allow-write tools/release/upload_version_file.ts "$VERSION" || exit 0)
          [ -z "$LATEST_FILE" ] && exit 0
          aws s3 cp "$LATEST_FILE" "s3://$DL_S3_BUCKET/$LATEST_FILE" --content-type text/plain
          echo "LATEST_FILE=$LATEST_FILE" >> "$GITHUB_ENV"
      - name: Purge CDN cache
        if: env.HAS_CLOUDFLARE_TOKEN == 'true'
        env:
          CLOUDFLARE_ZONE_ID: '${{ secrets.CLOUDFLARE_ZONE_ID }}'
          CLOUDFLARE_API_TOKEN: '${{ secrets.CLOUDFLARE_API_TOKEN }}'
        run: |-
          # These live at a stable URL but change every release, so the edge
          # has to be told to drop them. Otherwise `ende upgrade` keeps
          # serving the previous version until the 4 hour TTL expires.
          deno run -A --lock=tools/deno.lock.json tools/release/purge_cdn_cache.ts versions.json ${LATEST_FILE:+"$LATEST_FILE"}

