name: pr
on:
  pull_request:
    types:
      - opened
      - edited
      - synchronize
jobs:
  main:
    name: lint title
    runs-on: ubuntu-latest
    steps:
      - name: Clone repository
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: primary
          persist-credentials: false
      - name: Install Ende
        shell: bash
        run: |-
          case "${RUNNER_OS}-${RUNNER_ARCH}" in
            Linux-X64)   target=x86_64-unknown-linux-gnu ;;
            Linux-ARM64) target=aarch64-unknown-linux-gnu ;;
            macOS-ARM64) target=aarch64-apple-darwin ;;
            Windows-X64) target=x86_64-pc-windows-msvc ;;
            *) echo "No Ende release for ${RUNNER_OS}-${RUNNER_ARCH}"; exit 1 ;;
          esac
          dir="$(./tools/release/fetch_ende.sh "$target" "$RUNNER_TEMP/ende")"
          "$dir/ende" --version
          if command -v cygpath > /dev/null; then dir="$(cygpath -w "$dir")"; fi
          echo "$dir" >> "$GITHUB_PATH"
      - name: Lint
        env:
          PR_TITLE: '${{ github.event.pull_request.title }}'
        run: 'ende run https://raw.githubusercontent.com/theende/ende/refs/heads/primary/tools/verify_pr_title.js "$PR_TITLE"'

