[package]
name = "ende_resolver"
version = "0.90.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
readme = "README.md"
repository.workspace = true
description = "Ende resolution algorithm"

[lib]
path = "lib.rs"

[features]
deno_ast = ["dep:deno_ast", "deno_graph/swc"]
graph = ["deno_graph", "http", "ende_permissions"]
sync = [
  "dashmap",
  "deno_unsync/tokio",
  "ende_maybe_sync/sync",
  "ende_config/sync",
  "ende_cache_dir/sync",
]

[dependencies]
anyhow.workspace = true
async-once-cell.workspace = true
async-trait.workspace = true
boxed_error.workspace = true
capacity_builder.workspace = true
chrono.workspace = true
dashmap = { workspace = true, optional = true }
deno_ast = { workspace = true, optional = true }
deno_error.workspace = true
deno_graph = { workspace = true, optional = true }
deno_media_type.workspace = true
deno_path_util.workspace = true
deno_semver.workspace = true
deno_terminal.workspace = true
deno_unsync.workspace = true
ende_cache_dir.workspace = true
ende_config.workspace = true
ende_env.workspace = true
ende_lockfile.workspace = true
ende_maybe_sync.workspace = true
ende_permissions = { workspace = true, optional = true }
futures.workspace = true
http = { workspace = true, optional = true }
imara-diff.workspace = true
import_map.workspace = true
indexmap.workspace = true
jsonc-parser.workspace = true
log.workspace = true
once_cell.workspace = true
parking_lot.workspace = true
phf = { workspace = true, features = ["macros"] }
rustc-hash.workspace = true
serde.workspace = true
serde_json.workspace = true
sys_traits.workspace = true
thiserror.workspace = true
twox-hash.workspace = true
url.workspace = true

[dev-dependencies]
sys_traits = { workspace = true, features = ["getrandom", "memory", "real", "serde_json"] }
test_util.workspace = true
