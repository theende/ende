[package]
name = "ende_cli_parser"
version = "0.9.0"
authors.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Zero-cost CLI argument parser for the Ende CLI"

[lib]
path = "src/lib.rs"

[dependencies]
deno_semver.workspace = true
ende_config = { workspace = true, features = ["workspace"] }
ende_core.workspace = true
ende_lib.workspace = true
ende_permissions.workspace = true
ende_runtime.workspace = true
log.workspace = true
serde = { workspace = true, features = ["derive"] }
sys_traits = { workspace = true, features = ["real"] }

[dev-dependencies]
criterion.workspace = true
pretty_assertions.workspace = true

[[bench]]
name = "parse"
harness = false
