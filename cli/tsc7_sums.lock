# Pinned TypeScript 7 compiler (`tsc`) for `--unstable-tsc7`.
#
# This file is the trust anchor for the TypeScript 7 binaries Ende bundles.
# Each entry pins, for one Ende target, the npm package that ships `tsc`, the
# integrity of its tarball as published at
#   https://registry.npmjs.org/<package>/-/<package name>-<version>.tgz
# (npm's `dist.integrity`), and the SHA-256 of the `tsc` binary inside it
# (`package/lib/tsc`, `tsc.exe` on Windows). `tools/tsc7_mirror.ts` checks
# both and lays the files out for dl.ende.sh.
#
# To bump: change the version, take each package's `dist.integrity` from
# https://registry.npmjs.org/<package>/<version>, check it against the
# downloaded tarball, and fill in the SHA-256 of the `tsc` in it. Then run
# `tools/tsc7_mirror.ts` and upload its output.
#
# Format: one `<target>  <package>  <tarball integrity>  <tsc sha256>` per
# line. The `# version: X.Y.Z` directive is the TypeScript version.
#
# version: 7.0.2

