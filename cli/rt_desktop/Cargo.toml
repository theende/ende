[package]
name = "endert_desktop"
version = "2.7.4"
authors.workspace = true
edition.workspace = true
license.workspace = true
publish = false
repository.workspace = true
description = "Provides libendert shared library for laufey desktop apps"

[lib]
name = "endert"
path = "lib.rs"
crate-type = ["cdylib"]

[features]
default = ["v8"]
quickjs = ["ende_core/quickjs", "endert/quickjs", "v8/quickjs"]
v8 = ["ende_core/v8", "endert/v8", "v8/v8"]

[build-dependencies]
ende_runtime.workspace = true
ende_core.workspace = true
v8.workspace = true

[dependencies]
deno_error.workspace = true
deno_terminal.workspace = true
ende_core.workspace = true
ende_lib.workspace = true
ende_runtime.workspace = true
ende_snapshots.workspace = true
endert = { path = "../rt", default-features = false }
laufey = "0.7.0"
libsui.workspace = true

log = { workspace = true, features = ["serde"] }
raw-window-handle.workspace = true
rustls.workspace = true
serde_json.workspace = true
tokio.workspace = true
v8.workspace = true

[target.'cfg(unix)'.dependencies]
libc.workspace = true

[dev-dependencies]
tempfile.workspace = true
